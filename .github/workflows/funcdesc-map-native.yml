name: Native MachO FuncDesc map
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "llvm/utils/funcdesc-map/**"
      - "llvm/lib/CodeGen/CJMetadata.cpp"
      - ".github/workflows/funcdesc-map-native.yml"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Link real llc objects and compare final addresses
        run: |
          ulimit -c 0
          python3 llvm/utils/funcdesc-map/native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funcdesc-map-${{ matrix.runner }}
          path: funcdesc-map-results/
